global
    log stdout format raw local0
    maxconn 512

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout queue 10s

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend tunnel_origin
    bind :8080
    # This listener is host-loopback only; only the trusted cloudflared path may use it.
    http-request del-header Forwarded
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Forwarded-For %[src] unless { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Forwarded-Proto https
    default_backend application

backend application
    balance leastconn
    option httpchk GET /healthz
    http-check expect status 200
    # Add the gateway hop after the sanitized original client address.
    option forwardfor
    server-template app 2 app:3000 check inter 3s fall 3 rise 2 resolvers docker init-addr libc,none
