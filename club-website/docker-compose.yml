services:
  app:
    build: .
    container_name: bimclub_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-root}
      # Local-only fallback keeps the original `docker compose up` workflow
      # usable when .env has not been created yet. Production compose still
      # requires an explicit secret.
      - DB_PASSWORD=${DB_PASSWORD:-bimclub_local_dev_password}
      - DB_NAME=${DB_NAME:-club_database}
      - PORT=${PORT:-3000}
      - SESSION_SECRET=${SESSION_SECRET:-bimclub_local_dev_session_secret}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - ./src:/usr/src/app/src
      - ./public:/usr/src/app/public
      - ./middleware:/usr/src/app/middleware
      - ./config:/usr/src/app/config
      - ./uploads:/usr/src/app/uploads
      # ดึงโฟลเดอร์ assets ที่อยู่ด้านนอกโปรเจกต์เข้ามาใน Docker
      - ../assets:/usr/src/assets
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: bimclub_db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD:-bimclub_local_dev_password}
      - MARIADB_DATABASE=${DB_NAME:-club_database}
    ports:
      - "3306:3306"
    volumes:
      - db_data_local:/var/lib/mysql
      # Map the schema.sql to the init folder so tables are auto-created!
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    profiles: ["debug"]
    image: phpmyadmin:latest
    container_name: bimclub_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${DB_PASSWORD:-bimclub_local_dev_password}
    depends_on:
      - db

volumes:
  # Keep the legacy volume untouched; this fresh local volume is initialized
  # with the documented development fallback credentials.
  db_data_local:
