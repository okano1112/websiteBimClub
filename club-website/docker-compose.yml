version: '3.8'

services:
  app:
    build: .
    container_name: bimclub_app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=club_database
      - PORT=3000
      - SESSION_SECRET=bimclub-super-secret-2026-change-me
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - APP_URL=http://localhost:3000
    volumes:
      - ./uploads:/usr/src/app/uploads
      # ดึงโฟลเดอร์ assets ที่อยู่ด้านนอกโปรเจกต์เข้ามาใน Docker
      - ../assets:/usr/src/assets
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: bimclub_db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_DATABASE=club_database
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Map the schema.sql to the init folder so tables are auto-created!
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bimclub_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - db

volumes:
  db_data: