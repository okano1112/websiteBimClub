<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="../css/global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าบัญชี - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/navbar-component.js"></script>
</head>
<body>
  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <main class="settings-page">
        <section class="settings-header">
            <h1>ตั้งค่าบัญชี</h1>
            <p id="settingsRole">กำลังโหลดข้อมูลผู้ใช้...</p>
        </section>

        <section class="settings-layout">
            <form id="profileForm" class="settings-card">
                <h2>ข้อมูลโปรไฟล์</h2>
                <div id="profileMessage" class="settings-message"></div>

                <div class="avatar-editor">
                    <div id="avatarPreview" class="settings-avatar">U</div>
                    <div class="avatar-actions">
                        <label for="avatarFile" class="file-button">เลือกรูปโปรไฟล์</label>
                        <input type="file" id="avatarFile" accept="image/*">
                    </div>
                </div>

                <div class="settings-field">
                    <label for="fullName">ชื่อ-นามสกุล</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="settings-field">
                    <label for="phone">เบอร์โทร</label>
                    <input type="tel" id="phone" inputmode="tel">
                </div>

                <button type="submit" class="settings-submit">บันทึกข้อมูลโปรไฟล์</button>
            </form>

                <section class="settings-section">
                    <div class="section-header">
                        <h2>🔒 ความปลอดภัย</h2>
                        <p>เปลี่ยนรหัสผ่านเพื่อความปลอดภัยของบัญชี</p>
                    </div>
                    
                    <div class="security-card">
                        <p style="color: #4b5563; font-size: 0.95rem; margin-bottom: 16px;">
                            ระบบจะส่งลิงก์สำหรับเปลี่ยนรหัสผ่านไปยังอีเมลของคุณเพื่อยืนยันตัวตน
                        </p>
                        <a href="forget.html" class="button outline" style="display: inline-block; text-decoration: none; text-align: center;">เปลี่ยนรหัสผ่านผ่านอีเมล</a>
                    </div>
                </section>
    </main>

    
    <script src="../js/auth.js"></script>
    <script src="../js/settings.js"></script>

    <!-- Global Footer -->
    <site-footer></site-footer>

<script src="../js/footer-component.js"></script>
</body>
</html>
