<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="../css/global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าบัญชี - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/navbar-component.js"></script>
</head>
<body>
  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <main class="settings-page">
        <section class="settings-header">
            <h1>ตั้งค่าบัญชี</h1>
            <p id="settingsRole">กำลังโหลดข้อมูลผู้ใช้...</p>
        </section>

        <section class="settings-layout" aria-label="การตั้งค่าบัญชี">
            <form id="profileForm" class="settings-card" data-settings-section="profile">
                <h2>ข้อมูลโปรไฟล์</h2>
                <div id="profileMessage" class="settings-message" role="status"></div>

                <div class="avatar-editor">
                    <div id="avatarPreview" class="settings-avatar">U</div>
                    <div class="avatar-actions">
                        <label for="avatarFile" class="file-button">เลือกรูปโปรไฟล์</label>
                        <input type="file" id="avatarFile" accept="image/*">
                    </div>
                </div>

                <div class="settings-field">
                    <label for="fullName">ชื่อ-นามสกุล</label>
                    <input type="text" id="fullName" maxlength="100" autocomplete="name" required>
                </div>

                <div class="settings-field">
                    <label for="age">อายุ</label>
                    <input type="number" id="age" min="0" max="120" inputmode="numeric" placeholder="ไม่ระบุก็ได้">
                </div>

                <div class="settings-field">
                    <label for="phone">เบอร์โทร</label>
                    <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="เช่น 0812345678">
                </div>

                <button type="submit" class="settings-submit">บันทึกข้อมูลโปรไฟล์</button>
            </form>

            <div class="settings-stack">
                <form id="passwordForm" class="settings-card" data-settings-section="password">
                    <h2>ตั้งค่ารหัสผ่าน</h2>
                    <p class="settings-help">ใช้รหัสผ่านปัจจุบันเพื่อยืนยันตัวตน หรือกู้คืนผ่านอีเมลหากจำไม่ได้</p>
                    <div id="passwordMessage" class="settings-message" role="status"></div>
                    <div class="settings-field">
                        <label for="currentPassword">รหัสผ่านปัจจุบัน</label>
                        <input type="password" id="currentPassword" autocomplete="current-password" required>
                    </div>
                    <div class="settings-field">
                        <label for="newPassword">รหัสผ่านใหม่</label>
                        <input type="password" id="newPassword" minlength="8" autocomplete="new-password" required>
                        <small>อย่างน้อย 8 ตัวอักษร</small>
                    </div>
                    <div class="settings-field">
                        <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
                        <input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="settings-submit">เปลี่ยนรหัสผ่าน</button>
                    <a href="forget.html" class="settings-secondary-link">จำรหัสผ่านไม่ได้? กู้คืนผ่านอีเมล</a>
                </form>

                <form id="recoveryForm" class="settings-card" data-settings-section="recovery">
                    <h2>เบอร์โทรศัพท์เพื่อกู้คืน</h2>
                    <p class="settings-help">บันทึกเบอร์สำรองสำหรับการติดต่อกู้คืนบัญชีในอนาคต</p>
                    <div id="recoveryMessage" class="settings-message" role="status"></div>
                    <div class="settings-field">
                        <label for="recoveryPhone">เบอร์โทรศัพท์สำรอง</label>
                        <input type="tel" id="recoveryPhone" inputmode="tel" autocomplete="tel" placeholder="เช่น 0898765432">
                    </div>
                    <button type="submit" class="settings-submit">บันทึกเบอร์สำรอง</button>
                </form>
            </div>
        </section>
    </main>

    
    <script src="../js/auth.js"></script>
    <script src="../js/settings.js"></script>

    <!-- Global Footer -->
    <site-footer></site-footer>

<script src="../js/footer-component.js"></script>
</body>
</html>
