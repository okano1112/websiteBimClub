<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="../css/global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการเนื้อหา - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin-cms.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/navbar-component.js"></script>
</head>
<body>
  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <main class="admin-container cms-container">
        <div class="admin-nav">
            <a href="admin.html">จัดการโพสต์</a>
            <a href="admin-cms.html" class="active">จัดการเนื้อหา</a>
            <a href="admin-instructor-requests.html">คำขอสิทธิ์อาจารย์</a>
            <a href="admin-users.html">จัดการผู้ใช้งาน</a>
            <a href="admin-honor.html">เกียรติยศ / Honor</a>
        </div>

        <header class="cms-header">
            <h1 class="page-title">จัดการเนื้อหา</h1>
            <div class="cms-tabs" role="tablist" aria-label="เลือกประเภทเนื้อหา">
                <button type="button" class="cms-tab active" data-section="activities">กิจกรรม</button>
                <button type="button" class="cms-tab" data-section="achievements">ผลงาน</button>
            </div>
        </header>

        <section class="admin-card cms-editor">
            <h2 class="card-title" id="cmsFormTitle">เพิ่มกิจกรรม</h2>
            <div id="cmsMessage" class="cms-message"></div>

            <form id="cmsForm">
                <input type="hidden" id="cmsItemId">
                <input type="hidden" id="cmsImageUrl">

                <div class="form-group">
                    <label for="cmsTitle">หัวข้อ</label>
                    <input type="text" id="cmsTitle" placeholder="กรอกหัวข้อ" required>
                </div>

                <div class="form-group">
                    <label for="cmsDescription">รายละเอียด</label>
                    <textarea id="cmsDescription" placeholder="กรอกรายละเอียด" required></textarea>
                </div>

                <div class="form-group">
                    <label class="file-label" for="cmsImage">เลือกรูปภาพ</label>
                    <input type="file" id="cmsImage" accept="image/*" class="file-input">
                    <div id="cmsImagePreview" class="cms-image-preview"></div>
                </div>

                <div class="cms-actions">
                    <button type="button" class="btn-cancel" id="cmsCancelBtn">ยกเลิก</button>
                    <button type="submit" class="btn-submit" id="cmsSubmitBtn">บันทึก</button>
                </div>
            </form>
        </section>

        <section class="admin-card">
            <h2 class="card-title" id="cmsListTitle">รายการกิจกรรม</h2>
            <div id="cmsList" class="cms-list">
                <div class="loading-text">กำลังโหลดข้อมูล...</div>
            </div>
        </section>
    </main>

    
    <script src="../js/auth.js"></script>
    <script src="../js/admin-cms.js"></script>

    <!-- Global Footer -->
    <site-footer></site-footer>

<script src="../js/footer-component.js"></script>
</body>
</html>
