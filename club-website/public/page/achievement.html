<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../css/global.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements - BimClub</title>
  <link rel="icon" type="image/png" href="../../../assets/img/logobranding/logobim.png">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/achievement.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="../js/navbar-component.js"></script>
</head>

<body>
  <!-- Navbar Component -->
  <site-navbar></site-navbar>

  <!-- Hero Section -->
  <section class="achieve-hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-badge">ผลงาน</span>
      <h1>ผลงานของเรา</h1>
      <p>รวมผลงานเด่นของสมาชิก BimClub ที่สร้างสรรค์ขึ้นจากความรู้ ทักษะ และความร่วมมือ</p>
    </div>
  </section>

  <!-- Achievement Cards Grid -->
  <section class="achievements-section">
    <div class="section-header">
      <h2>โปรเจกต์ที่โดดเด่น</h2>
      <p>คลิกที่การ์ดเพื่อดูรายละเอียดผลงาน</p>
    </div>

    <div class="cards-grid">

      <!-- Cards will be injected by achievement-dynamic.js -->
    </div>
  </section>

  <!-- ==================== -->
  <!-- 3D Carousel Modal    -->
  <!-- ==================== -->
  <div class="carousel-modal" id="carouselModal">
    <button class="modal-close" id="modalClose">✕</button>

    <div class="modal-inner">
      <!-- 3D Carousel -->
      <div class="carousel-wrapper">
        <div class="carousel-scene">
          <div class="carousel-ring" id="carouselRing">
            <!-- Slides injected by JS -->
          </div>
        </div>

        <!-- Nav buttons -->
        <button class="carousel-nav prev" id="prevBtn">‹</button>
        <button class="carousel-nav next" id="nextBtn">›</button>

        <!-- Dots -->
        <div class="carousel-dots" id="carouselDots"></div>
      </div>

      <!-- Description panel -->
      <div class="carousel-info" id="carouselInfo">
        <h3 id="infoTitle">ชื่อผลงาน</h3>
        <p id="infoDesc">รายละเอียดผลงาน</p>
      </div>
    </div>
  </div>

    
  <script>
    // ============================================
    // Project data — replace images & text later
    // ============================================
    // Projects data is now fetched from the API via achievement-dynamic.js

    // ============================================
    // 3D Carousel Logic
    // ============================================
    const modal = document.getElementById('carouselModal');
    const ring = document.getElementById('carouselRing');
    const dots = document.getElementById('carouselDots');
    const infoTitle = document.getElementById('infoTitle');
    const infoDesc = document.getElementById('infoDesc');
    const closeBtn = document.getElementById('modalClose');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = 0;
    let slideCount = 0;
    let angleStep = 0;
    let currentSlides = [];

    // Build the 3D ring of slides
    function buildCarousel(projectKey) {
      const project = projectsData[projectKey];
      if (!project) return;

      currentSlides = project.slides;
      slideCount = currentSlides.length;
      angleStep = 360 / slideCount;

      // translateZ distance — keeps slides spaced out around the ring
      const tz = Math.round(260 / Math.tan(Math.PI / slideCount));

      ring.innerHTML = '';
      dots.innerHTML = '';

      currentSlides.forEach((slide, i) => {
        // Slide element
        const div = document.createElement('div');
        div.className = 'carousel-slide';
        div.style.transform = `rotateY(${i * angleStep}deg) translateZ(${tz}px)`;
        div.innerHTML = `<img src="${slide.img}" alt="${slide.caption}" />`;
        ring.appendChild(div);

        // Dot button
        const dot = document.createElement('button');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goTo(i));
        dots.appendChild(dot);
      });

      ring.style.transform = 'rotateY(0deg)';
      currentIndex = 0;
      updateInfo();
    }

    function goTo(index) {
      currentIndex = index;
      ring.style.transform = `rotateY(${-(currentIndex * angleStep)}deg)`;
      updateInfo();
    }

    function next() {
      goTo((currentIndex + 1) % slideCount);
    }

    function prev() {
      goTo((currentIndex - 1 + slideCount) % slideCount);
    }

    function updateInfo() {
      const slide = currentSlides[currentIndex];
      const parts = slide.caption.split('—');
      infoTitle.textContent = parts[0].trim();
      infoDesc.textContent = parts.length > 1 ? parts[1].trim() : slide.caption;

      dots.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === currentIndex);
      });
    }

    // ============================================
    // Open / Close Modal
    // ============================================
    document.querySelectorAll('.achieve-card').forEach(card => {
      card.addEventListener('click', () => {
        buildCarousel(card.dataset.project);
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);

    // Keyboard: Escape, ←, →
    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    // ============================================
    // Scroll-in animation for cards
    // ============================================
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('show');
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.achieve-card').forEach(c => observer.observe(c));
  </script>
    
  <script src="../js/achievement-dynamic.js"></script>
  <script src="../js/auth.js"></script>

    <!-- Global Footer -->
    <site-footer></site-footer>

<script src="../js/footer-component.js"></script>
</body>

</html>
