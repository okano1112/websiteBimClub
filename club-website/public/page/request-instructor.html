<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="../css/global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอสิทธิ์อาจารย์ - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/instructor-requests.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/navbar-component.js"></script>
</head>
<body>
  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <main class="request-page">
        <h1>ขอสิทธิ์อาจารย์</h1>
        <p class="request-lead">กรอกข้อมูลเพื่อส่งคำขอเป็นอาจารย์ของ BimClub ผู้ดูแลระบบจะเป็นผู้อนุมัติ</p>

        <div id="statusBox" class="request-status-box" style="display:none;"></div>
        <div id="formMessage" class="request-message"></div>

        <form id="requestForm" class="request-card">
            <div class="request-field">
                <label for="faculty">คณะ</label>
                <input type="text" id="faculty" required maxlength="200" placeholder="เช่น คณะวิศวกรรมศาสตร์">
            </div>
            <div class="request-field">
                <label for="fullName">ชื่อ-นามสกุล</label>
                <input type="text" id="fullName" required maxlength="100" placeholder="ชื่อที่ใช้แสดงในคำขอ">
            </div>
            <div class="request-field">
                <label for="phone">เบอร์โทร</label>
                <input type="tel" id="phone" required maxlength="30" placeholder="เช่น 0812345678">
            </div>
            <button type="submit" class="request-submit" id="submitBtn">ส่งคำขอ</button>
        </form>
    </main>

    
    <script src="../js/auth.js"></script>
    <script src="../js/request-instructor.js"></script>

    <!-- Global Footer -->
    <site-footer></site-footer>

<script src="../js/footer-component.js"></script>
</body>
</html>
