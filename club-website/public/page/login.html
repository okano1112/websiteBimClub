<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BimClub - เข้าสู่ระบบ</title>
    <link rel="icon" type="image/png" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth-layout.css">
  <script src="../js/navbar-component.js"></script>
  <link rel="stylesheet" href="../css/apple-ui.css">
</head>
<body class="apple-ui apple-auth">
    <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../../../assets/img/logobranding/logobim.png" alt="BimClub">
                <h1>เข้าสู่ระบบ</h1>
                <p class="apple-auth-lead">กลับมาเรียนรู้และสร้างผลงานไปด้วยกัน</p>
            </div>

            <div id="loginError" class="text-danger text-center mb-3 d-none"></div>
            <div id="loginVerify" class="bg-warning-light text-center mb-3 p-3 rounded-sm d-none">
                กรุณายืนยันอีเมลของคุณก่อนเข้าสู่ระบบ
                <button id="resendVerifyBtn" type="button" class="btn btn-outline w-100 mt-3">กรอกรหัสยืนยัน / ขอรหัสใหม่</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">ชื่อผู้ใช้หรืออีเมล</label>
                    <input type="text" id="username" class="form-control" placeholder="กรอกชื่อผู้ใช้หรืออีเมล" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log in</button>
                <div class="auth-links">
                    <a href="register.html">สมัครสมาชิก</a>
                    <a href="forget.html">ลืมรหัสผ่าน?</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Global Footer -->
    <site-footer></site-footer>
    <script src="../js/login.js"></script>
    <script src="../js/auth.js"></script>
<script src="../js/footer-component.js"></script>
</body>
</html>
