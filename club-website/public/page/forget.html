<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - BimClub</title>
    <link rel="icon" type="image/png" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth-layout.css">
  <script src="../js/navbar-component.js"></script>
</head>
<body>
  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../../../assets/img/logobranding/logobim.png" alt="BimClub">
                <h1>ลืมรหัสผ่าน</h1>
            </div>

            <p class="text-center text-muted mb-3">กรอกอีเมลของคุณเพื่อรับลิงก์ตั้งรหัสผ่านใหม่</p>
            <div id="forgotMsg" class="text-center mb-3 p-3 rounded-sm d-none"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label class="form-label" for="email">อีเมล (Email)</label>
                    <input type="email" id="email" class="form-control" required placeholder="example@email.com">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">ส่งลิงก์กู้คืนรหัสผ่าน</button>
                <div class="auth-links" class="auth-links justify-content-center mt-3">
                    <a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('forgotMsg');
            const btn = document.getElementById('forgotBtn');
            msgDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            btn.textContent = 'กำลังส่ง...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    msgDiv.textContent = data.message;
                    msgDiv.style.background = '#dcfce7';
                    msgDiv.style.color = '#166534';
                    msgDiv.style.display = 'block';
                    document.getElementById('forgotForm').reset();
                } else {
                    msgDiv.textContent = data.message;
                    msgDiv.style.background = '#fef2f2';
                    msgDiv.style.color = 'var(--danger)';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
                msgDiv.style.background = '#fef2f2';
                msgDiv.style.color = 'var(--danger)';
                msgDiv.style.display = 'block';
            }

            btn.textContent = 'ส่งลิงก์กู้คืนรหัสผ่าน';
            btn.disabled = false;
        });
    </script>
    <script src="../js/auth.js"></script>
    <!-- Global Footer -->
    <site-footer></site-footer>
<script src="../js/footer-component.js"></script>
</body>
</html>
