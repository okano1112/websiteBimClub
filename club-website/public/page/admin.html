<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="../css/global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการโพสต์ - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/navbar-component.js"></script>
</head>
<body>

  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <!-- Main Content -->
    <div class="admin-container">
        <div class="admin-nav">
            <a href="admin.html" class="active">จัดการโพสต์</a>
            <a href="admin-cms.html">จัดการเนื้อหา</a>
            <a href="admin-instructor-requests.html">คำขอสิทธิ์อาจารย์</a>
            <a href="admin-users.html">จัดการผู้ใช้งาน</a>
            <a href="admin-honor.html">เกียรติยศ / Honor</a>
        </div>

        <h1 class="page-title">จัดการโพสต์</h1>
        
        <!-- Create Post -->
        <div class="admin-card">
            <h2 class="card-title">สร้างโพสต์ใหม่</h2>
            <form id="createPostForm">
                <div class="form-group">
                    <textarea id="postContent" placeholder="เขียนข้อความอะไรบางอย่าง..." required></textarea>
                </div>
                <div class="form-group">
                    <label class="file-label" for="postImages">เลือกรูปภาพ (หลายรูปได้)</label>
                    <input type="file" id="postImages" multiple accept="image/*" class="file-input">
                    <div id="imagePreviews" class="image-previews"></div>
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">เผยแพร่</button>
            </form>
        </div>

        <!-- Post List -->
        <div class="admin-card">
            <h2 class="card-title">โพสต์ทั้งหมด</h2>
            <div id="postsList" class="posts-list">
                <div class="loading-text">กำลังโหลดข้อมูล...</div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>

    <!-- Global Footer -->
    <site-footer></site-footer>

<script src="../js/footer-component.js"></script>
</body>
</html>
