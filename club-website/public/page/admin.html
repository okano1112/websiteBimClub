<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="../css/global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการโพสต์ - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/navbar-component.js"></script>
</head>
<body>

  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <!-- Main Content -->
    <div class="admin-container">
        <nav class="admin-breadcrumb" aria-label="Breadcrumb"><a href="admin-dashboard.html">Dashboard</a><span>/</span><span>Posts</span></nav>
        <header class="admin-page-header"><div><p class="admin-eyebrow">Content Operations</p><h1 class="page-title">จัดการโพสต์</h1><p>สร้าง แก้ไข และดูแลโพสต์ของชุมชน</p></div></header>
        
        <!-- Create Post -->
        <div class="admin-card">
            <h2 class="card-title">สร้างโพสต์ใหม่</h2>
            <form id="createPostForm">
                <div class="form-group">
                    <textarea id="postContent" placeholder="เขียนข้อความอะไรบางอย่าง..." required></textarea>
                </div>
                <div class="form-group">
                    <label class="file-label" for="postImages">เลือกรูปภาพ (หลายรูปได้)</label>
                    <input type="file" id="postImages" multiple accept="image/*" class="file-input">
                    <div id="imagePreviews" class="image-previews"></div>
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">เผยแพร่</button>
            </form>
        </div>

        <!-- Post List -->
        <div class="admin-card">
            <h2 class="card-title">โพสต์ทั้งหมด</h2>
            <div class="admin-toolbar">
                <input id="postSearch" class="admin-input" type="search" placeholder="ค้นหาเนื้อหาหรือผู้เขียน" aria-label="ค้นหาโพสต์">
                <select id="postSort" class="admin-select" aria-label="เรียงโพสต์"><option value="newest">ใหม่ล่าสุด</option><option value="oldest">เก่าสุด</option></select>
            </div>
            <div id="postsList" class="posts-list">
                <div class="loading-text">กำลังโหลดข้อมูล...</div>
            </div>
            <div class="admin-pagination"><span id="postPageInfo"></span><div class="admin-pagination-actions"><button id="postPrev" type="button">ก่อนหน้า</button><button id="postNext" type="button">ถัดไป</button></div></div>
        </div>

    </div>

    <!-- Scripts -->
    
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>

    <!-- Global Footer -->
    <site-footer></site-footer>

<script src="../js/footer-component.js"></script>
</body>
</html>
