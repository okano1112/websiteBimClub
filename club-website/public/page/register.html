<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BimClub - สมัครสมาชิก</title>
    <link rel="icon" type="image/png" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth-layout.css">
  <script src="../js/navbar-component.js"></script>
</head>
<body>
  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <main class="auth-wrapper">
        <div class="auth-card" >
            <div class="auth-header">
                <img src="../../../assets/img/logobranding/logobim.png" alt="BimClub">
                <h1>สมัครสมาชิก</h1>
            </div>

            <div id="registerError" class="text-danger text-center mb-3 d-none"></div>
            <div id="registerSuccess" class="bg-success-light text-center mb-3 p-3 rounded-sm d-none"></div>

            <form id="registerForm">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">ชื่อผู้ใช้ (Username)</label>
                        <input type="text" id="regUsername" class="form-control" placeholder="ตั้งชื่อผู้ใช้งาน" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">อีเมล (Email)</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="example@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">ชื่อ - นามสกุล (Full Name)</label>
                    <input type="text" id="regFullName" class="form-control" placeholder="ชื่อจริง นามสกุล" required>
                </div>
                <div class="form-group">
                    <label class="form-label">รหัสผ่าน (Password)</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">ยืนยันการสมัคร</button>
                <div class="auth-links" class="auth-links justify-content-center mt-3">
                    <span>มีบัญชีอยู่แล้ว? <a href="login.html" >เข้าสู่ระบบที่นี่</a></span>
                </div>
            </form>
        </div>
    </main>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-col">
                    <h3>BimClub</h3>
                    <p>ชมรมที่สร้างสรรค์และพัฒนาทักษะด้าน BIM ให้แก่นิสิตและผู้สนใจอย่างมืออาชีพ</p>
                </div>
                <div class="footer-col">
                    <h3>เมนู</h3>
                    <ul>
                        <li><a href="../index.html">หน้าแรก</a></li>
                        <li><a href="about.html">เกี่ยวกับเรา</a></li>
                        <li><a href="activity.html">กิจกรรม</a></li>
                        <li><a href="achievement.html">ผลงาน</a></li>
                        <li><a href="honor.html">เกียรติยศ</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h3>ติดต่อเรา</h3>
                    <p>มหาวิทยาลัย xxxx<br>อาคารคณะวิศวกรรมศาสตร์</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 BimClub. All Rights Reserved.</p>
            </div>
        </div>
    </footer>
    <script src="../js/auth.js"></script>
</body>
</html>
