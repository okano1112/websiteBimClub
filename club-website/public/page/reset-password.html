<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - BimClub</title>
    <link rel="icon" type="image/png" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans Thai', sans-serif; background: #f3f4f6; }
        .reset-container { max-width: 420px; margin: 80px auto 40px; padding: 30px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
        .reset-container h1 { color: #ad0f0f; margin-bottom: 8px; font-size: 1.5rem; }
        .reset-container p { color: #666; margin-bottom: 20px; font-size: 0.9rem; }
        .reset-field { text-align: left; margin-bottom: 16px; }
        .reset-field label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
        .reset-field input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; font-family: inherit; }
        .reset-btn { width: 100%; padding: 14px; background: #ad0f0f; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
        .reset-btn:hover { background: #8b0c0c; }
        .reset-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .reset-msg { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 0.9rem; }
        .reset-msg.success { background: #dcfce7; color: #166534; display: block; }
        .reset-msg.error { background: #fef2f2; color: #dc2626; display: block; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">
            <a href="../index.html">
                <img src="../../../assets/img/logobranding/logobim.png" width="80px" height="50px" alt="BimClub Logo" />
            </a>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="../index.html">หน้าแรก</a></li>
                <li><a href="about.html">เกี่ยวกับเรา</a></li>
                <li><a href="activity.html">กิจกรรม</a></li>
                <li><a href="achievement.html">ผลงาน</a></li>
                <li><a href="login.html">เข้าสู่ระบบ</a></li>
                <li><a href="register.html">สมัครสมาชิก</a></li>
            </ul>
        </nav>
    </div>

    <div class="reset-container">
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <p>กรอกรหัสผ่านใหม่ที่ต้องการ</p>

        <div id="resetMsg" class="reset-msg"></div>

        <form id="resetForm">
            <div class="reset-field">
                <label for="newPassword">รหัสผ่านใหม่</label>
                <input type="password" id="newPassword" required placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6">
            </div>
            <div class="reset-field">
                <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
                <input type="password" id="confirmPassword" required placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="6">
            </div>
            <button type="submit" class="reset-btn" id="resetBtn">ตั้งรหัสผ่านใหม่</button>
        </form>
    </div>

    <script>
        // ดึง token จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('resetMsg').textContent = 'ลิงก์ไม่ถูกต้อง — ไม่พบ token กู้คืนรหัสผ่าน';
            document.getElementById('resetMsg').className = 'reset-msg error';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('resetMsg');
            const btn = document.getElementById('resetBtn');
            msgDiv.className = 'reset-msg';
            msgDiv.style.display = 'none';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                msgDiv.textContent = 'รหัสผ่านไม่ตรงกัน';
                msgDiv.className = 'reset-msg error';
                return;
            }

            btn.textContent = 'กำลังบันทึก...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (data.success) {
                    msgDiv.textContent = data.message;
                    msgDiv.className = 'reset-msg success';
                    document.getElementById('resetForm').style.display = 'none';

                    // Redirect ไปหน้า login หลัง 2 วินาที
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    msgDiv.textContent = data.message;
                    msgDiv.className = 'reset-msg error';
                }
            } catch (err) {
                msgDiv.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
                msgDiv.className = 'reset-msg error';
            }

            btn.textContent = 'ตั้งรหัสผ่านใหม่';
            btn.disabled = false;
        });
    </script>
    <script src="../js/auth.js"></script>
</body>
</html>
