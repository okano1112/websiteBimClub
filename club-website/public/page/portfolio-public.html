<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พอร์ตโฟลิโอ - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans Thai', sans-serif; background: #f3f4f6; color: #111827; }
        
        .resume-container { max-width: 800px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
        .resume-header { background: #ad0f0f; color: #fff; padding: 40px; text-align: center; }
        .resume-avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #fff; margin: 0 auto 16px; object-fit: cover; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: bold; }
        .resume-name { font-size: 2rem; margin-bottom: 8px; }
        .resume-headline { font-size: 1.1rem; opacity: 0.9; margin-bottom: 16px; }
        .resume-website { display: inline-block; padding: 6px 16px; background: rgba(255,255,255,0.1); border-radius: 99px; color: #fff; text-decoration: none; font-size: 0.9rem; }
        
        .resume-body { padding: 40px; }
        .resume-section { margin-bottom: 32px; }
        .resume-section-title { font-size: 1.25rem; color: #ad0f0f; border-bottom: 2px solid #fef2f2; padding-bottom: 8px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        
        .resume-summary { font-size: 1rem; line-height: 1.7; color: #4b5563; }
        
        .resume-skills { display: flex; flex-wrap: wrap; gap: 8px; }
        .resume-skill { background: #f3f4f6; color: #374151; padding: 6px 14px; border-radius: 99px; font-size: 0.9rem; font-weight: 500; }
        
        .resume-item { margin-bottom: 20px; }
        .resume-item-title { font-weight: 600; font-size: 1.1rem; color: #111827; }
        .resume-item-subtitle { color: #4b5563; font-size: 0.95rem; margin: 4px 0; }
        .resume-item-date { color: #9ca3af; font-size: 0.85rem; margin-bottom: 8px; }
        .resume-item-desc { color: #4b5563; font-size: 0.95rem; line-height: 1.6; }
        
        .resume-error { text-align: center; padding: 60px; color: #6b7280; font-size: 1.1rem; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="../index.html"><img src="../../../assets/img/logobranding/logobim.png" alt="BimClub Logo"></a>
        </div>
        <div class="menu">
            <ul>
                <li><a href="../index.html">หน้าแรก</a></li>
                <li><a href="about.html">เกี่ยวกับเรา</a></li>
                <li><a href="activity.html">กิจกรรม</a></li>
                <li><a href="achievement.html">ผลงาน</a></li>
                <li><a href="login.html">เข้าสู่ระบบ</a></li>
                <li><a href="register.html">สมัครสมาชิก</a></li>
            </ul>
        </div>
    </nav>

    <!-- Content -->
    <div id="resumeContainer">
        <div class="resume-error" id="loadingState">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- Scripts -->
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');
            const container = document.getElementById('resumeContainer');
            
            if (!userId) {
                container.innerHTML = '<div class="resume-error">ไม่พบพอร์ตโฟลิโอนี้ หรือยังไม่เปิดเป็นสาธารณะ</div>';
                return;
            }

            try {
                const res = await fetch(`/api/portfolios/public/${userId}`);
                if (!res.ok) throw new Error('Not found');
                
                const data = await res.json();
                const port = data.portfolio || data;
                
                const avatarHtml = port.user_avatar 
                    ? `<img src="${port.user_avatar}" class="resume-avatar" alt="Avatar">`
                    : `<div class="resume-avatar">${(port.user_name || 'U').charAt(0).toUpperCase()}</div>`;
                    
                const websiteHtml = port.website_url ? `<a href="${port.website_url}" target="_blank" class="resume-website">เว็บไซต์</a>` : '';
                
                let skillsHtml = '';
                if (port.skills) {
                    const skills = typeof port.skills === 'string' ? JSON.parse(port.skills) : port.skills;
                    skillsHtml = skills.map(s => `<span class="resume-skill">${s}</span>`).join('');
                }

                let expHtml = '';
                if (port.experiences && port.experiences.length > 0) {
                    expHtml = port.experiences.map(exp => `
                        <div class="resume-item">
                            <div class="resume-item-title">${exp.position}</div>
                            <div class="resume-item-subtitle">${exp.company}</div>
                            <div class="resume-item-date">${exp.start_date} ถึง ${exp.end_date || 'ปัจจุบัน'}</div>
                            <div class="resume-item-desc">${exp.description || ''}</div>
                        </div>
                    `).join('');
                } else {
                    expHtml = '<p style="color:#9ca3af;font-size:0.9rem">ไม่มีข้อมูล</p>';
                }

                let eduHtml = '';
                if (port.education && port.education.length > 0) {
                    eduHtml = port.education.map(edu => `
                        <div class="resume-item">
                            <div class="resume-item-title">${edu.degree}</div>
                            <div class="resume-item-subtitle">${edu.institution} | ${edu.field_of_study}</div>
                            <div class="resume-item-date">ปีที่จบ: ${edu.graduation_year}</div>
                        </div>
                    `).join('');
                } else {
                    eduHtml = '<p style="color:#9ca3af;font-size:0.9rem">ไม่มีข้อมูล</p>';
                }

                container.innerHTML = `
                    <div class="resume-container">
                        <div class="resume-header">
                            ${avatarHtml}
                            <h1 class="resume-name">${port.user_name || 'ไม่ระบุชื่อ'}</h1>
                            <div class="resume-headline">${port.headline || ''}</div>
                            ${websiteHtml}
                        </div>
                        <div class="resume-body">
                            ${port.summary ? `
                                <div class="resume-section">
                                    <h2 class="resume-section-title">เกี่ยวกับฉัน</h2>
                                    <div class="resume-summary">${port.summary}</div>
                                </div>
                            ` : ''}
                            
                            ${skillsHtml ? `
                                <div class="resume-section">
                                    <h2 class="resume-section-title">ทักษะ</h2>
                                    <div class="resume-skills">${skillsHtml}</div>
                                </div>
                            ` : ''}
                            
                            <div class="resume-section">
                                <h2 class="resume-section-title">ประสบการณ์การทำงาน</h2>
                                ${expHtml}
                            </div>
                            
                            <div class="resume-section">
                                <h2 class="resume-section-title">ประวัติการศึกษา</h2>
                                ${eduHtml}
                            </div>
                        </div>
                    </div>
                `;

                document.title = `${port.user_name || 'Portfolio'} - BimClub`;

            } catch (err) {
                container.innerHTML = '<div class="resume-error">ไม่พบพอร์ตโฟลิโอนี้ หรือยังไม่เปิดเป็นสาธารณะ</div>';
            }
        });
    </script>
</body>
</html>
