<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="../css/global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พอร์ตโฟลิโอ - BimClub</title>
    <link rel="icon" href="../../../assets/img/logobranding/logobim.png">
    <link rel="stylesheet" href="../css/navbar.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/portfolio-public.css">
  <script src="../js/navbar-component.js"></script>
</head>
<body>

  <!-- Navbar Component -->
  <site-navbar></site-navbar>

    <!-- Content -->
    <div id="resumeContainer">
        <div class="resume-error" id="loadingState">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- Scripts -->
    
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');
            const container = document.getElementById('resumeContainer');
            
            if (!userId) {
                container.innerHTML = '<div class="resume-error">ไม่พบพอร์ตโฟลิโอนี้ หรือยังไม่เปิดเป็นสาธารณะ</div>';
                return;
            }

            try {
                const res = await fetch(`/api/portfolios/public/${userId}`);
                if (!res.ok) throw new Error('Not found');
                
                const data = await res.json();
                const port = data.portfolio || data;
                
                const avatarHtml = port.user_avatar 
                    ? `<img src="${port.user_avatar}" class="resume-avatar" alt="Avatar">`
                    : `<div class="resume-avatar">${(port.user_name || 'U').charAt(0).toUpperCase()}</div>`;
                    
                const websiteHtml = port.website_url ? `<a href="${port.website_url}" target="_blank" class="resume-website">เว็บไซต์</a>` : '';
                
                let skillsHtml = '';
                if (port.skills) {
                    const skills = typeof port.skills === 'string' ? JSON.parse(port.skills) : port.skills;
                    skillsHtml = skills.map(s => `<span class="resume-skill">${s}</span>`).join('');
                }

                let expHtml = '';
                if (port.experiences && port.experiences.length > 0) {
                    expHtml = port.experiences.map(exp => `
                        <div class="resume-item">
                            <div class="resume-item-title">${exp.position}</div>
                            <div class="resume-item-subtitle">${exp.company}</div>
                            <div class="resume-item-date">${exp.start_date} ถึง ${exp.end_date || 'ปัจจุบัน'}</div>
                            <div class="resume-item-desc">${exp.description || ''}</div>
                        </div>
                    `).join('');
                } else {
                    expHtml = '<p style="color:#9ca3af;font-size:0.9rem">ไม่มีข้อมูล</p>';
                }

                let eduHtml = '';
                if (port.education && port.education.length > 0) {
                    eduHtml = port.education.map(edu => `
                        <div class="resume-item">
                            <div class="resume-item-title">${edu.degree}</div>
                            <div class="resume-item-subtitle">${edu.institution} | ${edu.field_of_study}</div>
                            <div class="resume-item-date">ปีที่จบ: ${edu.graduation_year}</div>
                        </div>
                    `).join('');
                } else {
                    eduHtml = '<p style="color:#9ca3af;font-size:0.9rem">ไม่มีข้อมูล</p>';
                }

                let projHtml = '';
                if (port.projects && port.projects.length > 0) {
                    projHtml = port.projects.map(proj => `
                        <div class="resume-item" style="overflow:hidden;">
                            ${proj.image_url ? `<img src="${proj.image_url}" style="width:120px; height:80px; object-fit:cover; float:left; margin-right:16px; border-radius:8px;">` : ''}
                            <div class="resume-item-title">${proj.title}</div>
                            <div class="resume-item-desc">${proj.description || ''}</div>
                            ${proj.project_url ? `<a href="${proj.project_url}" target="_blank" style="font-size:0.9rem; color:#ad0f0f; display:inline-block; margin-top:4px;">ดูลิงก์ผลงาน</a>` : ''}
                            <div style="clear:both;"></div>
                        </div>
                    `).join('');
                } else {
                    projHtml = '<p style="color:#9ca3af;font-size:0.9rem">ไม่มีข้อมูล</p>';
                }

                container.innerHTML = `
                    <div class="resume-container">
                        <div class="resume-header">
                            ${avatarHtml}
                            <h1 class="resume-name">${port.user_name || 'ไม่ระบุชื่อ'}</h1>
                            <div class="resume-headline">${port.headline || ''}</div>
                            ${websiteHtml}
                        </div>
                        <div class="resume-body">
                            ${port.summary ? `
                                <div class="resume-section">
                                    <h2 class="resume-section-title">เกี่ยวกับฉัน</h2>
                                    <div class="resume-summary">${port.summary}</div>
                                </div>
                            ` : ''}
                            
                            ${skillsHtml ? `
                                <div class="resume-section">
                                    <h2 class="resume-section-title">ทักษะ</h2>
                                    <div class="resume-skills">${skillsHtml}</div>
                                </div>
                            ` : ''}
                            
                            <div class="resume-section">
                                <h2 class="resume-section-title">ประสบการณ์การทำงาน</h2>
                                ${expHtml}
                            </div>
                            
                            <div class="resume-section">
                                <h2 class="resume-section-title">ประวัติการศึกษา</h2>
                                ${eduHtml}
                            </div>

                            <div class="resume-section">
                                <h2 class="resume-section-title">ผลงานส่วนตัว</h2>
                                ${projHtml}
                            </div>
                        </div>
                    </div>
                `;

                document.title = `${port.user_name || 'Portfolio'} - BimClub`;

            } catch (err) {
                container.innerHTML = '<div class="resume-error">ไม่พบพอร์ตโฟลิโอนี้ หรือยังไม่เปิดเป็นสาธารณะ</div>';
            }
        });
    </script>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-col">
                    <h3>BimClub</h3>
                    <p>ชมรมที่สร้างสรรค์และพัฒนาทักษะด้าน BIM (Building Information Modeling) ให้แก่นิสิตและผู้สนใจอย่างมืออาชีพ</p>
                </div>
                <div class="footer-col">
                    <h3>เมนู</h3>
                    <ul>
                        <li><a href="../index.html">หน้าแรก</a></li>
                        <li><a href="about.html">เกี่ยวกับเรา</a></li>
                        <li><a href="activity.html">กิจกรรม</a></li>
                        <li><a href="achievement.html">ผลงาน</a></li>
                        <li><a href="honor.html">เกียรติยศ</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h3>ติดต่อเรา</h3>
                    <p>มหาวิทยาลัย xxxx<br>อาคารคณะวิศวกรรมศาสตร์</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 BimClub. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
