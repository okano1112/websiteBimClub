services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    container_name: bimclub_app_production_like
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${DB_USER:?Set a non-root application DB user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:-club_database}
      PORT: 3000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-7}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP hostname}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set the SMTP username}
      SMTP_PASS: ${SMTP_PASS:?Set the SMTP password}
      APP_URL: ${APP_URL:?Set the HTTPS application origin}
    volumes:
      - production_uploads:/usr/src/app/uploads
      - ../assets:/usr/src/assets:ro
    depends_on:
      db:
        condition: service_healthy
      db_bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  db:
    image: mariadb:10.11
    restart: unless-stopped
    container_name: bimclub_db_production_like
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate database administrator password}
      MARIADB_DATABASE: ${DB_NAME:-club_database}
    volumes:
      - production_db_data:/var/lib/mysql
      - ./database/schema.production.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6

  db_bootstrap:
    build: .
    restart: "no"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${DB_USER:?Set a non-root application DB user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate database administrator password}
      DB_NAME: ${DB_NAME:-club_database}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      APP_URL: ${APP_URL:?Set the HTTPS application origin}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP hostname}
      SMTP_USER: ${SMTP_USER:?Set the SMTP username}
      SMTP_PASS: ${SMTP_PASS:?Set the SMTP password}
    command: ["node", "scripts/ops/ensure-app-user.cjs"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  production_db_data:
  production_uploads:
