name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: club-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: club-website/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      - run: node --test test/*.test.js
      - run: node scripts/ops/build-production-schema.cjs && git diff --exit-code -- database/schema.production.sql
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t bimclub:verify .
      - run: sh scripts/qa/run-hardening.sh
        env:
          QA_IMAGE: bimclub:verify
